name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: mvn -B -ntp verify
      - name: Upload p2 site
        uses: actions/upload-artifact@v4
        with:
          name: p2-site
          path: com.mavensearch.eclipse.site/target/repository
